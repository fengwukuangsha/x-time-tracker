<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="bonusToast" class="bonus-toast"></div>

  <!-- Reward Popup -->
  <div id="rewardOverlay" class="reward-overlay">
    <div class="reward-card">
      <div class="reward-char" id="rewardChar"></div>
      <div class="reward-title" id="rewardTitle">每日签到</div>
      <div class="reward-streak" id="rewardStreak">🔥 1 <span>天连续登录</span></div>
      <div class="reward-bonus hidden" id="rewardBonus">+50 积分</div>
      <div class="reward-hint">点击任意处关闭</div>
    </div>
  </div>

  <!-- Main Screen (always shown) -->
  <div id="mainScreen">
    <div class="header">
      <div class="logo">X</div>
      <h1>Time Tracker</h1>
      <div class="user-menu">
        <div class="user-avatar" id="userAvatar" title="点击查看菜单">?</div>
        <div class="user-dropdown hidden" id="userDropdown">
          <div class="user-info" id="userInfoBlock">
            <div class="user-name" id="userName"></div>
            <div class="user-email" id="userEmail"></div>
          </div>
          <button class="btn-auth-secondary" id="btnGoSignIn" style="display:none;">登录/注册</button>
          <button class="btn-logout" id="btnLogout">登出</button>
        </div>
      </div>
    </div>

    <div class="status-card">
      <div id="statusLabel" class="status-label">当前没有在计时</div>
      <div id="timer" class="timer idle">--:--</div>
      <div class="progress-bar">
        <div id="progressFill" class="progress-fill" style="width: 0%; background: #22c55e;"></div>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat">
        <div id="todayTotal" class="stat-value">0m</div>
        <div class="stat-label">今日累计</div>
      </div>
      <div class="stat">
        <div id="limitDisplay" class="stat-value">10m</div>
        <div class="stat-label">时间上限</div>
      </div>
    </div>

    <div class="honor-card">
      <div class="honor-top">
        <div class="honor-icon" id="honorIcon"></div>
        <div class="honor-detail">
          <span class="honor-name" id="honorName">新手</span>
          <span class="honor-points-text" id="honorPoints">0 积分</span>
        </div>
        <div class="streak-tag" id="streakTag">
          <span id="streakFire">🔥</span>
          <span id="streakDays">0</span>天
        </div>
      </div>
      <div class="level-bar">
        <div class="level-fill" id="levelFill" style="width: 0%; background: #737373;"></div>
      </div>
      <div class="level-hint" id="levelHint">距离下一等级还需 50 积分</div>
    </div>

    <!-- Leaderboard -->
    <div class="leaderboard-section">
      <button id="leaderboardToggle" class="leaderboard-toggle">
        <span>🏆 排行榜</span>
        <span id="leaderboardArrow">&#9662;</span>
      </button>
      <div id="leaderboardPanel" class="leaderboard-panel">
        <div id="leaderboardList"></div>
      </div>
    </div>

    <div class="settings-section">
      <div class="setting-row">
        <span class="setting-label">提醒间隔（分钟）</span>
        <input id="limitInput" type="number" class="setting-input" min="1" max="120" value="10">
      </div>
      <div class="setting-row">
        <span class="setting-label">离开重置阈值（分钟）</span>
        <input id="resetThresholdInput" type="number" class="setting-input" min="1" max="30" value="3">
      </div>
      <div class="setting-row">
        <span class="setting-label">重置今日统计</span>
        <button id="resetBtn" class="btn-reset">重置</button>
      </div>
    </div>

    <div class="history-section">
      <button id="historyToggle" class="history-toggle">
        <span>历史记录</span>
        <span id="historyArrow">&#9662;</span>
      </button>
      <div id="historyPanel" class="history-panel" style="display:none;">
        <div id="historyList"></div>
      </div>
    </div>

    <div class="footer">离开 x.com 自动暂停计时</div>
  </div>

  <script type="module" src="./popup.js"></script>
</body>
</html>
